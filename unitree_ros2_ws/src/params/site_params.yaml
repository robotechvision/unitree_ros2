scan_matcher:
  ros__parameters:
    output_frame_id: "laser_odom"
    robot_frame_id: "pelvis"
    gps_frame_id: "global"
    registration_method: "NDT"
    ndt_resolution: 0.5
    ndt_num_threads: 4
    trans_for_mapupdate: 0.5
    vg_size_for_input: 0.1  # 0.2
    vg_size_for_map: 0.1  # 0.2
    use_min_max_filter: false
    map_publish_period: 1.0
    num_targeted_cloud: 20
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
    use_imu: false
    use_odom: true
    use_gps: false  # true
    debug_flag: false
    max_ground_points_intensity: 0.15
    max_odom_inclination_deviation: 0.3  # 0.3
    max_odom_angular_speed_deviation: 0.7854  # 0.7854
    max_odom_linear_speed_deviation: 1.0  # 0.5
    # combine_odoms: true

graph_based_slam:
  ros__parameters:
    robot_frame_id: "pelvis"
    registration_method: "FastGICP"
    score_ground_filter_max_intensity: 0.15
    score_used_points_ratio: 0.92
    use_pure_candidate: false
    use_scan_context: true  # TODO: use up to first localization
    use_cvtnet: false # config for cvtnet located at /graph_based_slam/src/registration/cvtnet/python/config/config.yml
    input_submap_distance: 0.5  # should be same as scanmatcher's trans_for_mapupdate
    scan_context_detection_threshold: 0.4  # 0.15
    scan_context_use_intensity: true
    rotation_epsilon: 2e-3
    transformation_epsilon: 1e-7
    num_threads: 4
    max_num_iterations: 100  # 20
    ndt_resolution: 5.0
    ndt_num_threads: 2
    voxel_leaf_size: 0.15  # 0.3
    vgicp_resolution: 0.15 # 0.3
    loop_detection_period: 1000
    threshold_loop_closure_score: 0.05
    distance_loop_closure: 5.0
    range_of_searching_loop_closure: 0.5
    loop_closure_search_consider_z: false
    search_submap_num: 1
    num_adjacent_pose_cnstraints: 1
    rotation_weight_multiplier: 2.0
    loop_closure_weight: 2.0
    fix_weight_xy: 0.0 # 0.0001
    fix_weight_z: 0.0 # 0.1
    inclination_weight: 1.0
    use_save_map_in_loop: false
    loaded_map_static: true
    publish_map_cloud: true
    optimization_verbose: false
    optimization_num_iterations: 100

ground_height_grid_interp:
  ros__parameters:
    base_footprint_frame: "right_ankle_roll_link"
    min_points: 2500
    radius: 12.5
    voxel_size: 5.0
    subvoxels_per_voxel_dim: 5
    min_voxel_points_count: 30
    high_variance_voxel_threshold: 1.0
    max_point_height_blur: 0.3
    range_difference_threshold: 0.8 # not used, high_variance_voxel_threshold used instead
    range_ratio_threshold: 2.0 # not used, high_variance_voxel_threshold used instead
    add_points_outside_radius: true
    bound_negative_heights: true
    lidar_upside_down: true
